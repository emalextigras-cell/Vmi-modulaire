name: Tests JavaScript

on:
  push:
    branches:
      - work/modularisation-phase-1
  pull_request:
    branches:
      - main

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exécuter les tests
        run: npm test
